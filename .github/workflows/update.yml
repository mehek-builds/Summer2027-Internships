name: Update list

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # List and history use one validated immutable generation and publish together.
      - run: node scripts/refresh.mjs
      - name: Commit if the list changed
        run: |
          if [ -z "$(git status --porcelain README.md lists data)" ]; then
            echo "No change"
            exit 0
          fi
          git config user.name "Mehek Mandal"
          git config user.email "mehekbuilds@gmail.com"
          git add README.md lists data
          git commit -m "Update list $(date -u +%Y-%m-%d)"
          git push
