name: Update list

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
      # The feed deletes closed postings after two days, so this is the only record of how long
      # internships stay open. A failed snapshot must not block the list update.
      - run: node scripts/snapshot.mjs
        continue-on-error: true
      - name: Commit if the list changed
        run: |
          if [ -z "$(git status --porcelain README.md lists data)" ]; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md lists data
          git commit -m "Update list $(date -u +%Y-%m-%d)"
          git push
